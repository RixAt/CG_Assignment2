name: Build

on: push:
    pull_request:
    
jobs:
    windows-msvc:
        name: Windows MSVC
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
  
            - name: Install vcpkg and dependencies
              uses: microsoft/vcpkg-action@v0
              with: 
                triplet: x64-windows
                vcpkgArguments: freeglut

            - name: Configure CMake
              run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake

            - name: Build
              run: cmake --build build --config Release --parallel

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: RobotDance-windows
                  path: 
                    build/Release/RobotDance.exe
                    dance1.wav
    linux: 
        name: Linux GCC
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
  
            - name: Install vcpkg and dependencies
              uses: microsoft/vcpkg-action@v0
              with: 
                triplet: x64-linux
                vcpkgArguments: freeglut
            - name: Configure CMake
              run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake
            - name: Build
              run: cmake --build build --config Release --parallel
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: RobotDance-linux
                  path: build/RobotDance
                    



  
    