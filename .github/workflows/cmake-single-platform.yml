name: Build

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    name: Windows MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
  
      - name: Get vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:GITHUB_WORKSPACE/vcpkg"
          & "$env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat"

      - name: Install deps (freeglut)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/vcpkg/vcpkg.exe" install freeglut:x64-windows

      - name: Configure CMake (Release)
        run: >
          cmake -B build -S CG_Assignment2
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobotDance-windows
          path: |
            build/Release/RobotDance.exe
            dance1.wav

  linux:
    name: Linux GCC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install vcpkg and dependencies
        uses: microsoft/vcpkg-action@v0.9.2
        with:
          triplet: x64-linux
          vcpkgArguments: install freeglut

      - name: Configure CMake (Release)
        run: >
          cmake -B build -S CG_Assignment2
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobotDance-linux
          path: |
            build/RobotDance
            dance1.wav
